version=0.2.0-SNAPSHOT
group=org.v31bank

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Nothing in this build configures another project, so this is the only line isolated
# projects needs. It is off because spring-boot's Gradle plugin is not ready for it: every
# BootJar reads the group and version of every project in the build, which fails the
# isolation check and takes every task in cloud/ with it. Everything else already passes,
# so `--isolated-projects` runs clean over the rest.
org.gradle.isolated-projects=false
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

buildJavaVersion=25
runtimeJavaVersion=25
javaFormatVersion=0.0.47
springBootVersion=4.1.1
checkstyleToolVersion=12.3.1
bufVersion=1.72.0
